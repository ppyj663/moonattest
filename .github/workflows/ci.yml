name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Type check (JavaScript)
        run: moon check --target js
      - name: Type check (Wasm-GC)
        run: moon check --target wasm-gc
      - name: Test (JavaScript)
        run: moon test --target js
      - name: Test (Wasm-GC)
        run: moon test --target wasm-gc
      - name: Package manifest
        run: moon package --list
      - name: End-to-end tamper demo
        shell: pwsh
        run: ./scripts/e2e.ps1
