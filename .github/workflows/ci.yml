name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MOON_VERSION: "0.1.20260904"
  MOONC_VERSION: "v0.10.12+1634b282e"

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          (Join-Path $HOME ".moon\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned toolchain
        shell: pwsh
        run: |
          if ($IsWindows) {
            ./scripts/verify-toolchain.ps1 `
              -MoonVersion $env:MOON_VERSION `
              -MooncVersion $env:MOONC_VERSION `
              -MoonSha256 c6834e7dab16959ade5766f7d2929618782aabea300b37b7e604156bed5dbbea `
              -MooncSha256 049697e99b95c28a1cef626e5040ed53bbd541f5be08bbed03407213642b52aa `
              -MoonrunSha256 67ebcfb651191cb2a0490a7c3823cb663d006707323a5669a76d1cdd6be2629d
          } else {
            ./scripts/verify-toolchain.ps1 `
              -MoonVersion $env:MOON_VERSION `
              -MooncVersion $env:MOONC_VERSION `
              -MoonSha256 ebf6f42b9c1667cbd1e3bff5cf7fb091f1250a3eea417724e5b1a80de49783a9 `
              -MooncSha256 a1fe6384cda566b33addc2082ab55845a712bd6b5f8a74244371a92b8afa7b36 `
              -MoonrunSha256 71f9874f6068577b0ff72b680ec9a2ef0924e53f2a171b3576eeab98c61bdbdb
          }
      - name: Show toolchain
        shell: pwsh
        run: |
          moon version --all
          node --version
          $PSVersionTable.PSVersion.ToString()
      - name: Resolve dependencies
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Type check (JavaScript)
        run: moon check --target js
      - name: Type check (Wasm-GC)
        run: moon check --target wasm-gc
      - name: Test (JavaScript)
        run: moon test --target js
      - name: Test (Wasm-GC)
        run: moon test --target wasm-gc
      - name: Package manifest
        run: moon package --list
      - name: End-to-end tamper demo
        shell: pwsh
        run: |
          try {
            ./scripts/e2e.ps1
          } catch {
            $message = $_.Exception.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=End-to-end test failed::$message"
            exit 1
          }
