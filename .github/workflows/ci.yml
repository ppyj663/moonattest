name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          (Join-Path $HOME ".moon\bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Show toolchain
        shell: pwsh
        run: |
          moon version --all
          node --version
          $PSVersionTable.PSVersion.ToString()
      - name: Resolve dependencies
        run: moon update
      - name: Format check
        run: moon fmt --check
      - name: Type check (JavaScript)
        run: moon check --target js
      - name: Type check (Wasm-GC)
        run: moon check --target wasm-gc
      - name: Test (JavaScript)
        run: moon test --target js
      - name: Test (Wasm-GC)
        run: moon test --target wasm-gc
      - name: Package manifest
        run: moon package --list
      - name: End-to-end tamper demo
        shell: pwsh
        run: |
          try {
            ./scripts/e2e.ps1
          } catch {
            $message = $_.Exception.Message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=End-to-end test failed::$message"
            exit 1
          }
